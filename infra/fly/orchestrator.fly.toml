app = "emberforge-orchestrator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  APP_TARGET = "orchestrator"

# The orchestrator is a pure BullMQ worker — no public HTTP. It must stay
# running so it can pick up queued jobs. Min 1, scale up by hand if you
# process many projects concurrently.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

[deploy]
  strategy = "rolling"
