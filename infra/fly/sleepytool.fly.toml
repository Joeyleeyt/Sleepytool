# fly.toml app configuration file generated for sleepytool on 2026-06-02T19:29:10+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sleepytool'
primary_region = 'lhr'

[build]
  dockerfile = '../../Dockerfile.render'

[deploy]
  strategy = 'immediate'

[env]
  NODE_ENV = 'production'
  NVENC_ENABLED = 'false'
  RENDER_WORK_DIR = '/data/emberforge'

  # 69labs image resolution. 1k is the only value this account/tier serves —
  # 2k/4k return `503 SERVICE_UNAVAILABLE` on submit (verified 2026-06-12), which
  # silently kills every image_with_motion shot. Raise only once the plan
  # actually supports it. See apps/workers/labs-worker/src/index.ts.
  LABS69_IMAGE_RESOLUTION = '1k'

  # The sleep renderer bakes the global cinematic grade + rising-ember overlay
  # into its final assembly (xfade-join) pass, so the final encode STREAM-COPIES
  # the master — it no longer runs a second full re-encode. This preset therefore
  # governs that single finishing pass (see packages/render/src/ffmpeg/concat.ts).
  # On this CPU-only VM 'veryfast' keeps the full 1080p pass tractable and is
  # perceptually equal to 'medium' at the same CRF (only a larger file); drop to
  # 'medium' for maximum compression efficiency / slower renders. Setting
  # CINEMATIC_GRADE='false' + CINEMATIC_OVERLAY='off' leaves nothing to bake in,
  # so the finishing pass is skipped and the master is stream-copied throughout.
  FFMPEG_X264_PRESET = 'veryfast'

  # --- Sleep-story renderer (render process) ---
  # Every clip cross-dissolves into the next (no hard cuts), short clips hold a
  # frozen slow-Ken-Burns last frame, narration stays authoritative. Set
  # SLEEP_RENDER='false' to fall back to the legacy hard-cut concat path.
  SLEEP_RENDER = 'true'
  SLEEP_CROSSFADE_DURATION = '3.5'          # dissolve within a scene (s) — longer = smoother
  SLEEP_SCENE_CROSSFADE_DURATION = '3.5'    # dissolve across scene boundaries (s)
  SLEEP_KENBURNS_MAX_ZOOM = '1.04'          # 4% push over a clip — clearly visible
                                            # zoom/pan motion the client asked for
                                            # (was 1.02 = imperceptible 2%)
  # Bake the grade + ember into the PARALLEL batch encodes and stream-copy-join
  # them, dropping the serial multi-hour final-join pass. Composite ~3-3.5h ->
  # ~2-2.5h on this CPU VM. Trade-off: the ~13 batch seams become hard CUTS
  # (scene-aligned where a scene fits in one batch; a scene longer than
  # SLEEP_RENDER_BATCH_SIZE clips takes one unavoidable mid-scene cut). The
  # hundreds of within-batch dissolves are unchanged. A/B vs dissolve-everywhere;
  # needs a FRESH project (or COMPOSITE_RESUME='false') to actually re-render.
  SLEEP_EFFECT_IN_BATCHES = 'true'

  # --- Visual pacing (classify stage) ---
  # Each visual "block" runs longer so the picture holds still; short sentences
  # merge forward until a block clears ~10s. MIN is the floor, TARGET the typical
  # length, MAX the ceiling for a single visual.
  SHOT_MIN_S = '10'
  SHOT_TARGET_S = '12'
  SHOT_MAX_S = '16'

  # --- Rising-ember overlay (final encode) ---
  # Smaller, slower sparks for the sleep look (see packages/render/.../filters.ts).
  CINEMATIC_EMBER_SPEED = '0.005'           # rise speed (smaller = slower)
  CINEMATIC_EMBER_BLUR = '0.8'              # glow radius (smaller = smaller particles)

# Two process groups → two machines.
#   workers — orchestrator + 69labs (labs/tts) + veo3 in ONE Node process.
#             All four are I/O-bound BullMQ consumers (they wait on external
#             HTTP APIs), so one process hosts them all with no CPU contention.
#             See apps/workers/all/src/index.ts.
#   render  — CPU-bound ffmpeg work; keeps the big VM + persistent volume.
[processes]
  workers = 'pnpm --filter @emberforge/workers start'
  render = 'pnpm --filter @emberforge/render-worker start'

[[mounts]]
  source = 'render_work'
  destination = '/data'
  processes = ['render']
  # A 2-hour 1080p job holds ~9gb assets + ~7gb master + ~7gb final + image
  # intermediates (~25-30gb peak). Size with headroom so encode never hits
  # ENOSPC. (initial_size only applies when Fly creates the volume.)
  initial_size = '50gb'

[[vm]]
  # I/O-bound combined process (orchestrator + 69labs + veo3 — all wait on
  # external HTTP). RAM, not CPU, is the constraint: veo3 (conc 4) and labs
  # (labsImage + labsVideo, ~conc 4 each) each buffer whole video downloads in
  # memory. 6gb gives those buffers + Node heap ~3.7x headroom even at
  # pessimistic clip sizes; raise the LABS69_*_MAX_CONCURRENCY caps only
  # alongside more RAM here.
  #
  # NOTE: shared-cpu machines cap at 2gb RAM per vCPU, so 6gb REQUIRES
  # shared-cpu-4x (max 8gb) — shared-cpu-2x would be rejected at 4gb max. The
  # extra vCPUs are incidental (the work is I/O-bound); we're buying the RAM.
  size = 'shared-cpu-4x'
  memory = '8gb'   # was '6gb'  (shared-cpu-4x supports up to 8gb)
  processes = ['workers']

[[vm]]
  # CPU-bound ffmpeg (no GPU/NVENC). Two encode-heavy stages: the parallel Ken
  # Burns image segments, and the crossfade assembly — whose FINAL (xfade-join)
  # pass bakes in the global cinematic grade + rising-ember overlay, so the final
  # encode then just stream-copies (one re-encode, not two). Both stages are
  # FILTER-bound (zoompan + xfade are single-threaded in ffmpeg). Prep saturates
  # cores by running one ffmpeg PER CORE (RENDER_MIX_CONCURRENCY=cores-1 ×
  # FFMPEG_INTERMEDIATE_THREADS=1). The batch xfade masters are bounded by RAM, not
  # cores: an ~80-input batch needs ~8gb, so the renderer auto-caps how many run at
  # once to fit (totalmem − reserve) and ships a smaller default batch
  # (SLEEP_RENDER_BATCH_SIZE=40, ~4gb each) — on 16gb that's ~3 batches in
  # parallel. This is what stops the OOM-kill → silent full-render-restart loop;
  # do NOT raise SLEEP_BATCH_CONCURRENCY/SLEEP_RENDER_BATCH_SIZE without adding RAM.
  # The single-threaded FINAL join over the whole film remains the one serial stage
  # — NVENC on a GPU box is the real lever for it. Set CINEMATIC_GRADE='false' +
  # CINEMATIC_OVERLAY='off' to skip the finishing pass entirely (stream-copy).
  size = 'performance-8x'
  memory = '16gb'
  processes = ['render']
