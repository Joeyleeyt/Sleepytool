# fly.toml app configuration file generated for sleepytool on 2026-06-02T19:29:10+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sleepytool'
primary_region = 'lhr'

[build]
  dockerfile = '../../Dockerfile.render'

[deploy]
  strategy = 'immediate'

[env]
  NODE_ENV = 'production'
  NVENC_ENABLED = 'false'
  RENDER_WORK_DIR = '/data/emberforge'

  # The final encode now re-encodes the master (it applies the global cinematic
  # grade + rising-ember overlay — see packages/render/src/ffmpeg/filters.ts),
  # rather than stream-copying. On this CPU-only VM 'veryfast' keeps that full
  # 1080p pass tractable. Drop to 'medium' for higher quality / slower renders,
  # or set CINEMATIC_GRADE='false' + CINEMATIC_OVERLAY='off' to restore the
  # instant stream-copy mux.
  FFMPEG_X264_PRESET = 'veryfast'

  # --- Sleep-story renderer (render process) ---
  # Every clip cross-dissolves into the next (no hard cuts), short clips hold a
  # frozen slow-Ken-Burns last frame, narration stays authoritative. Set
  # SLEEP_RENDER='false' to fall back to the legacy hard-cut concat path.
  SLEEP_RENDER = 'true'
  SLEEP_CROSSFADE_DURATION = '3.5'          # dissolve within a scene (s) — longer = smoother
  SLEEP_SCENE_CROSSFADE_DURATION = '3.5'    # dissolve across scene boundaries (s)
  SLEEP_KENBURNS_MAX_ZOOM = '1.02'          # 2% push over a clip (imperceptible)
  SLEEP_VIDEO_SLOWDOWN = '4'                # play AI video clips at 1/4 speed (dreamy slow motion)

  # --- Visual pacing (classify stage) ---
  # Each visual "block" runs longer so the picture holds still; short sentences
  # merge forward until a block clears ~10s. MIN is the floor, TARGET the typical
  # length, MAX the ceiling for a single visual.
  SHOT_MIN_S = '10'
  SHOT_TARGET_S = '12'
  SHOT_MAX_S = '16'

  # --- Rising-ember overlay (final encode) ---
  # Smaller, slower sparks for the sleep look (see packages/render/.../filters.ts).
  CINEMATIC_EMBER_SPEED = '0.005'           # rise speed (smaller = slower)
  CINEMATIC_EMBER_BLUR = '0.8'              # glow radius (smaller = smaller particles)

# Two process groups → two machines.
#   workers — orchestrator + 69labs (labs/tts) + veo3 in ONE Node process.
#             All four are I/O-bound BullMQ consumers (they wait on external
#             HTTP APIs), so one process hosts them all with no CPU contention.
#             See apps/workers/all/src/index.ts.
#   render  — CPU-bound ffmpeg work; keeps the big VM + persistent volume.
[processes]
  workers = 'pnpm --filter @emberforge/workers start'
  render = 'pnpm --filter @emberforge/render-worker start'

[[mounts]]
  source = 'render_work'
  destination = '/data'
  processes = ['render']
  # A 2-hour 1080p job holds ~9gb assets + ~7gb master + ~7gb final + image
  # intermediates (~25-30gb peak). Size with headroom so encode never hits
  # ENOSPC. (initial_size only applies when Fly creates the volume.)
  initial_size = '50gb'

[[vm]]
  # I/O-bound combined process (orchestrator + 69labs + veo3 — all wait on
  # external HTTP). RAM, not CPU, is the constraint: veo3 (conc 4) and labs
  # (labsImage + labsVideo, ~conc 4 each) each buffer whole video downloads in
  # memory. 6gb gives those buffers + Node heap ~3.7x headroom even at
  # pessimistic clip sizes; raise the LABS69_*_MAX_CONCURRENCY caps only
  # alongside more RAM here.
  #
  # NOTE: shared-cpu machines cap at 2gb RAM per vCPU, so 6gb REQUIRES
  # shared-cpu-4x (max 8gb) — shared-cpu-2x would be rejected at 4gb max. The
  # extra vCPUs are incidental (the work is I/O-bound); we're buying the RAM.
  size = 'shared-cpu-4x'
  memory = '6gb'
  processes = ['workers']

[[vm]]
  # CPU-bound ffmpeg (no GPU/NVENC). Two encode-heavy stages: the parallel Ken
  # Burns image segments, and the single final pass — which now RE-ENCODES the
  # master to bake in the global cinematic grade + rising-ember overlay (it no
  # longer stream-copies). 8 cores at FFMPEG_X264_PRESET='veryfast' (see [env])
  # keep both tractable; 16gb covers ~8 parallel 1080p zoompan encodes with room
  # to spare. Set CINEMATIC_GRADE='false' + CINEMATIC_OVERLAY='off' to drop the
  # final re-encode back to an instant stream-copy mux.
  size = 'performance-8x'
  memory = '16gb'
  processes = ['render']
